name: Finalize independent site

on:
  push:
    branches: [independent-migration]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror the exact current published Print 54 build once
        run: node scripts/mirror-lovable.mjs

      - name: Remove Lovable build dependency
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            publish = "public"

          [build.environment]
            NODE_VERSION = "22"
          EOF
          rm -f scripts/mirror-lovable.mjs

      - name: Commit the self-contained site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Print 54 fully independent from Lovable" || exit 0
          git push
